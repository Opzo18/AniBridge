<div id="AniBridgeSonarrPage" data-role="page" class="page type-interior pluginConfigurationPage"
    data-require="emby-input,emby-button,emby-checkbox,emby-select">
    <div data-role="content">
        <div class="content-primary">
            <div id="AniBridgeSonarrChips" style="margin-bottom:0.8em;"></div>
            <form id="AniBridgeSonarrForm">
                <h3 class="sectionTitle">Sonarr (TV shows)</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SonarrEnabled" />
                        <span>Enable Sonarr</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrUrl">URL (e.g. http://192.168.33.20:8989)</label>
                    <input id="SonarrUrl" type="text" is="emby-input" placeholder="http://192.168.33.20:8989" />
                    <div class="fieldDescription" id="SonarrUrlError" style="color:#e74c3c;"></div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrApiKey">API key</label>
                    <div style="display:flex;gap:0.4em;align-items:center;">
                        <input id="SonarrApiKey" type="password" is="emby-input" autocomplete="off" style="flex:1;min-width:0;" />
                        <button id="SonarrShowKey" type="button" is="emby-button" class="raised emby-button" style="flex:none;">
                            <span>Show</span>
                        </button>
                    </div>
                    <div class="fieldDescription">Settings → General → Security in Sonarr.</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrQualityProfileId">Quality profile</label>
                    <select is="emby-select" id="SonarrQualityProfileId" class="emby-select"></select>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrRootFolder">Root folder</label>
                    <select is="emby-select" id="SonarrRootFolder" class="emby-select"></select>
                    <div class="fieldDescription">Sonarr requires a root folder for every added series — pick where anime lands. With a single folder, Test selects it automatically.</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrMonitor">Monitor (new series)</label>
                    <select is="emby-select" id="SonarrMonitor" class="emby-select">
                        <option value="all">All episodes</option>
                        <option value="future">Future episodes</option>
                        <option value="none">None</option>
                    </select>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrSeriesType">Series type</label>
                    <select is="emby-select" id="SonarrSeriesType" class="emby-select">
                        <option value="anime">Anime (absolute numbers)</option>
                        <option value="standard">Standard (S01E05)</option>
                        <option value="daily">Daily (dates)</option>
                    </select>
                    <div class="fieldDescription">Anime type fits most anime numbering; Standard matches classic TV.</div>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SonarrSeasonFolder" />
                        <span>Season folder</span>
                    </label>
                </div>
                <div class="fieldDescription" id="AniBridgeSonarrWarn"></div>
                <div class="fieldDescription" id="AniBridgeSonarrTest"></div>

                <div style="display:flex;gap:0.5em;flex-wrap:wrap;">
                    <button id="SonarrTestBtn" is="emby-button" type="button" class="raised emby-button" style="flex:1;min-width:10em;">
                        <span>Test &amp; reload lists</span>
                    </button>
                    <button is="emby-button" type="submit" class="raised button-submit emby-button" style="flex:1;min-width:10em;">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var AniBridgeSonarr = { pluginId: 'befab610-6eca-4d99-8e12-cdb4e26114aa' };

        function aniBridgeNav(page) {
            if (window.Dashboard && Dashboard.navigate) {
                Dashboard.navigate('configurationpage?name=' + encodeURIComponent(page));
            }
        }

        // Server serializes PascalCase (Jellyfin default); accept both casings.
        function abPick(o, camel, pascal) {
            if (!o) { return undefined; }
            return o[camel] !== undefined ? o[camel] : o[pascal];
        }

        function abNormArr(data) {
            data = data || {};
            return {
                qualityProfiles: abPick(data, 'qualityProfiles', 'QualityProfiles') || [],
                rootFolders: abPick(data, 'rootFolders', 'RootFolders') || [],
                error: abPick(data, 'error', 'Error')
            };
        }

        function abNormStatus(s) {
            s = s || {};
            return {
                shindenOk: !!abPick(s, 'shindenOk', 'ShindenOk'),
                sonarrOk: !!abPick(s, 'sonarrOk', 'SonarrOk'),
                radarrOk: !!abPick(s, 'radarrOk', 'RadarrOk'),
                dryRun: !!abPick(s, 'dryRun', 'DryRun')
            };
        }

        function renderSonarrChips(s) {
            var box = document.querySelector('#AniBridgeSonarrChips');
            box.innerHTML = '';
            var bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:0.4em;flex-wrap:wrap;align-items:center;';
            var pages = [
                ['Overview', 'AniBridge', null],
                ['Shinden', 'AniBridge Shinden', s.shindenOk],
                ['Sonarr', 'AniBridge Sonarr', s.sonarrOk],
                ['Radarr', 'AniBridge Radarr', s.radarrOk]
            ];
            pages.forEach(function (p) {
                var b = document.createElement('button');
                b.type = 'button';
                var active = p[1] === 'AniBridge Sonarr';
                b.style.cssText = 'border:none;border-radius:0.4em;padding:0.4em 0.9em;' +
                    'cursor:' + (active ? 'default' : 'pointer') + ';' +
                    'font-weight:' + (active ? 'bold' : 'normal') + ';' +
                    'background:' + (active ? '#00a4dc' : 'rgba(127,140,141,0.25)') + ';color:#fff;';
                b.textContent = p[0] + (p[2] === null ? '' : (p[2] ? ' ✓' : ' ✗'));
                if (!active) {
                    (function (page) {
                        b.addEventListener('click', function () { aniBridgeNav(page); });
                    })(p[1]);
                }
                bar.appendChild(b);
            });
            var mode = document.createElement('span');
            mode.style.cssText = 'font-size:0.8em;font-weight:bold;color:' +
                (s.dryRun ? '#f39c12' : '#27ae60') + ';';
            mode.textContent = s.dryRun ? 'DRY RUN' : 'LIVE';
            bar.appendChild(mode);
            box.appendChild(bar);
        }

        function sonarrFormState() {
            return {
                enabled: document.querySelector('#SonarrEnabled').checked,
                url: document.querySelector('#SonarrUrl').value.trim(),
                key: document.querySelector('#SonarrApiKey').value.trim()
            };
        }

        function renderSonarrStatus() {
            var el = document.querySelector('#AniBridgeSonarrTest');
            if (AniBridgeSonarr.test) {
                el.style.color = AniBridgeSonarr.test.ok ? '#2ecc71' : '#e74c3c';
                el.textContent = AniBridgeSonarr.test.msg;
                return;
            }
            var snap = AniBridgeSonarr.snapshot;
            var cur = sonarrFormState();
            el.style.color = '';
            if (snap && (cur.enabled !== snap.enabled || cur.url !== snap.url || cur.key !== snap.key)) {
                el.textContent = 'Unsaved changes — Test or Save.';
            } else {
                el.textContent = '';
            }
        }

        function aniBridgeFillSelect(id, items, current, loaded) {
            var sel = document.querySelector('#' + id);
            sel.innerHTML = '';
            var values;
            if (!loaded) {
                // Lists not loaded: keep the saved value submittable, but say so.
                values = [{ value: current || '', text: '— Test the connection first —' }];
            } else {
                values = items.slice();
                if (current && !values.some(function (v) { return v.value === current; })) {
                    values.unshift({ value: current, text: current + ' (saved)' });
                }
                if (values.length === 0) {
                    values.unshift({ value: '', text: '— No entries found —' });
                }
            }
            values.forEach(function (v) {
                var o = document.createElement('option');
                o.value = v.value;
                o.textContent = v.text;
                sel.appendChild(o);
            });
            if (current) { sel.value = current; }
        }

        function sonarrProfileOptions(data) {
            return (data.qualityProfiles || []).map(function (p) {
                return { value: String(abPick(p, 'id', 'Id')), text: abPick(p, 'name', 'Name') };
            });
        }

        function sonarrFolderOptions(data) {
            return (data.rootFolders || []).map(function (f) { return { value: f, text: f }; });
        }

        function sonarrAutoSingle(id, options) {
            // One option means no real choice — select it so Save just works.
            if (options.length === 1) {
                document.querySelector('#' + id).value = options[0].value;
            }
        }

        function aniBridgeIsHttpUrl(s) {
            return /^https?:\/\/.+/.test((s || '').trim());
        }

        function aniBridgeSonarrTestNow() {
            var url = document.querySelector('#SonarrUrl').value;
            var key = document.querySelector('#SonarrApiKey').value;
            var urlErr = document.querySelector('#SonarrUrlError');
            urlErr.textContent = aniBridgeIsHttpUrl(url) ? '' : 'URL should look like http://192.168.33.20:8989';
            if (!aniBridgeIsHttpUrl(url) || !key.trim()) {
                AniBridgeSonarr.test = { ok: false, msg: 'Enter URL and API key first, then Test.' };
                renderSonarrStatus();
                return;
            }
            AniBridgeSonarr.test = null;
            var el = document.querySelector('#AniBridgeSonarrTest');
            el.style.color = '';
            el.textContent = 'Testing…';
            ApiClient.ajax({
                type: 'POST',
                url: ApiClient.getUrl('AniBridge/sonarr/test'),
                data: JSON.stringify({ url: url.trim(), apiKey: key.trim() }),
                contentType: 'application/json',
                dataType: 'json'
            }).then(function (data) {
                data = abNormArr(data);
                var curProfile = document.querySelector('#SonarrQualityProfileId').value;
                var curFolder = document.querySelector('#SonarrRootFolder').value;
                var profiles = sonarrProfileOptions(data);
                var folders = sonarrFolderOptions(data);
                aniBridgeFillSelect('SonarrQualityProfileId', profiles, curProfile, !data.error);
                aniBridgeFillSelect('SonarrRootFolder', folders, curFolder, !data.error);
                if (!data.error) {
                    sonarrAutoSingle('SonarrQualityProfileId', profiles);
                    sonarrAutoSingle('SonarrRootFolder', folders);
                }
                document.querySelector('#AniBridgeSonarrWarn').textContent = data.error || '';
                AniBridgeSonarr.test = data.error
                    ? { ok: false, msg: 'Test: ' + data.error }
                    : { ok: true, msg: '✓ Connected — ' + data.qualityProfiles.length +
                        ' profiles, ' + data.rootFolders.length + ' folders.' };
                renderSonarrStatus();
            }, function () {
                AniBridgeSonarr.test = { ok: false, msg: 'Test failed to run.' };
                renderSonarrStatus();
            });
        }

        document.querySelector('#AniBridgeSonarrPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            AniBridgeSonarr.test = null;
            ApiClient.getPluginConfiguration(AniBridgeSonarr.pluginId).then(function (config) {
                document.querySelector('#SonarrEnabled').checked = config.SonarrEnabled;
                document.querySelector('#SonarrUrl').value = config.SonarrUrl || '';
                document.querySelector('#SonarrApiKey').value = config.SonarrApiKey || '';
                document.querySelector('#SonarrMonitor').value = config.SonarrMonitor || 'all';
                document.querySelector('#SonarrSeriesType').value = config.SonarrSeriesType || 'anime';
                document.querySelector('#SonarrSeasonFolder').checked = config.SonarrSeasonFolder !== false;
                var savedProfile = String(config.SonarrQualityProfileId || 1);
                var savedFolder = config.SonarrRootFolder || '';
                AniBridgeSonarr.snapshot = sonarrFormState();
                aniBridgeFillSelect('SonarrQualityProfileId', [], savedProfile, false);
                aniBridgeFillSelect('SonarrRootFolder', [], savedFolder, false);
                renderSonarrStatus();
                ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/status'), dataType: 'json' })
                    .then(function (s) {
                        renderSonarrChips(abNormStatus(s));
                    }, function () { });
                // Load lists from saved settings (no test message on open).
                ApiClient.ajax({
                    type: 'GET',
                    url: ApiClient.getUrl('AniBridge/sonarr/options'),
                    dataType: 'json'
                }).then(function (data) {
                    data = abNormArr(data);
                    var profiles = sonarrProfileOptions(data);
                    var folders = sonarrFolderOptions(data);
                    aniBridgeFillSelect('SonarrQualityProfileId', profiles, savedProfile, !data.error);
                    aniBridgeFillSelect('SonarrRootFolder', folders, savedFolder, !data.error);
                    if (!data.error) {
                        sonarrAutoSingle('SonarrQualityProfileId', profiles);
                        sonarrAutoSingle('SonarrRootFolder', folders);
                    }
                    document.querySelector('#AniBridgeSonarrWarn').textContent = data.error || '';
                    Dashboard.hideLoadingMsg();
                }, function () {
                    document.querySelector('#AniBridgeSonarrWarn').textContent =
                        'Could not load lists from Sonarr. Check URL/key, saved values kept.';
                    Dashboard.hideLoadingMsg();
                });
            });
        });

        ['SonarrEnabled', 'SonarrUrl', 'SonarrApiKey'].forEach(function (id) {
            document.querySelector('#' + id).addEventListener('input', function () {
                AniBridgeSonarr.test = null;
                renderSonarrStatus();
            });
            document.querySelector('#' + id).addEventListener('change', function () {
                AniBridgeSonarr.test = null;
                renderSonarrStatus();
            });
        });

        document.querySelector('#SonarrTestBtn').addEventListener('click', aniBridgeSonarrTestNow);

        document.querySelector('#SonarrShowKey').addEventListener('click', function () {
            var input = document.querySelector('#SonarrApiKey');
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            this.textContent = show ? 'Hide' : 'Show';
        });

        document.querySelector('#AniBridgeSonarrForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var url = document.querySelector('#SonarrUrl').value;
            if (document.querySelector('#SonarrEnabled').checked && !aniBridgeIsHttpUrl(url)) {
                document.querySelector('#SonarrUrlError').textContent =
                    'URL should look like http://192.168.33.20:8989';
                return false;
            }
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(AniBridgeSonarr.pluginId).then(function (config) {
                config.SonarrEnabled = document.querySelector('#SonarrEnabled').checked;
                config.SonarrUrl = document.querySelector('#SonarrUrl').value.trim();
                config.SonarrApiKey = document.querySelector('#SonarrApiKey').value.trim();
                config.SonarrQualityProfileId = parseInt(document.querySelector('#SonarrQualityProfileId').value, 10) || 1;
                config.SonarrRootFolder = document.querySelector('#SonarrRootFolder').value;
                config.SonarrMonitor = document.querySelector('#SonarrMonitor').value || 'all';
                config.SonarrSeriesType = document.querySelector('#SonarrSeriesType').value || 'anime';
                config.SonarrSeasonFolder = document.querySelector('#SonarrSeasonFolder').checked;
                ApiClient.updatePluginConfiguration(AniBridgeSonarr.pluginId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    AniBridgeSonarr.snapshot = sonarrFormState();
                    AniBridgeSonarr.test = null;
                    renderSonarrStatus();
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/status'), dataType: 'json' })
                        .then(function (s) {
                            renderSonarrChips(abNormStatus(s));
                        }, function () { });
                });
            });
            return false;
        });
    </script>
</div>
