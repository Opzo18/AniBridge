<div id="AniBridgeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
    data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="AniBridgeConfigForm">
                <h3 class="sectionTitle">Shinden.pl</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="ShindenEnabled" />
                        <span>Enable Shinden sync</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ShindenUsername">Login or email</label>
                    <input id="ShindenUsername" type="text" is="emby-input" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ShindenPassword">Password</label>
                    <input id="ShindenPassword" type="password" is="emby-input" autocomplete="off" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ShindenUserId">List ID (e.g. 624951-nick)</label>
                    <input id="ShindenUserId" type="text" is="emby-input" />
                    <div class="fieldDescription">Public list: https://shinden.pl/animelist/TWOJE-ID</div>
                </div>

                <h3 class="sectionTitle">Sonarr (TV shows)</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SonarrEnabled" />
                        <span>Enable Sonarr</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrUrl">URL (e.g. http://192.168.33.20:8989)</label>
                    <input id="SonarrUrl" type="text" is="emby-input" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrApiKey">API key</label>
                    <input id="SonarrApiKey" type="password" is="emby-input" autocomplete="off" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrQualityProfileId">Quality profile ID</label>
                    <input id="SonarrQualityProfileId" type="number" is="emby-input" min="1" step="1" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="SonarrRootFolder">Root folder (Sonarr root folder path)</label>
                    <input id="SonarrRootFolder" type="text" is="emby-input" />
                </div>

                <h3 class="sectionTitle">Radarr (movies)</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="RadarrEnabled" />
                        <span>Enable Radarr</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrUrl">URL (e.g. http://192.168.33.20:7878)</label>
                    <input id="RadarrUrl" type="text" is="emby-input" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrApiKey">API key</label>
                    <input id="RadarrApiKey" type="password" is="emby-input" autocomplete="off" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrQualityProfileId">Quality profile ID</label>
                    <input id="RadarrQualityProfileId" type="number" is="emby-input" min="1" step="1" />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrRootFolder">Root folder (Radarr root folder path)</label>
                    <input id="RadarrRootFolder" type="text" is="emby-input" />
                </div>

                <h3 class="sectionTitle">Synced statuses</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncWatching" />
                        <span>Watching</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncPlanned" />
                        <span>Planned</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncCompleted" />
                        <span>Completed</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncOnHold" />
                        <span>On hold</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncDropped" />
                        <span>Dropped</span>
                    </label>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>

                <h3 class="sectionTitle">Manual sync</h3>
                <div>
                    <button id="AniBridgeSyncNow" is="emby-button" type="button" class="raised block emby-button">
                        <span>Sync now</span>
                    </button>
                </div>
                <div class="fieldDescription" id="AniBridgeSyncStatus"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var AniBridgeConfig = {
            pluginId: 'befab610-6eca-4d99-8e12-cdb4e26114aa',
            taskKey: 'AniBridgeDailySync'
        };

        function aniBridgeSetStatus(text) {
            document.querySelector('#AniBridgeSyncStatus').textContent = text;
        }

        document.querySelector('#AniBridgeConfigPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(AniBridgeConfig.pluginId).then(function (config) {
                document.querySelector('#ShindenEnabled').checked = config.ShindenEnabled;
                document.querySelector('#ShindenUsername').value = config.ShindenUsername || '';
                document.querySelector('#ShindenPassword').value = config.ShindenPassword || '';
                document.querySelector('#ShindenUserId').value = config.ShindenUserId || '';
                document.querySelector('#SonarrEnabled').checked = config.SonarrEnabled;
                document.querySelector('#SonarrUrl').value = config.SonarrUrl || '';
                document.querySelector('#SonarrApiKey').value = config.SonarrApiKey || '';
                document.querySelector('#SonarrQualityProfileId').value = config.SonarrQualityProfileId || 1;
                document.querySelector('#SonarrRootFolder').value = config.SonarrRootFolder || '';
                document.querySelector('#RadarrEnabled').checked = config.RadarrEnabled;
                document.querySelector('#RadarrUrl').value = config.RadarrUrl || '';
                document.querySelector('#RadarrApiKey').value = config.RadarrApiKey || '';
                document.querySelector('#RadarrQualityProfileId').value = config.RadarrQualityProfileId || 1;
                document.querySelector('#RadarrRootFolder').value = config.RadarrRootFolder || '';
                document.querySelector('#SyncWatching').checked = config.SyncWatching;
                document.querySelector('#SyncPlanned').checked = config.SyncPlanned;
                document.querySelector('#SyncCompleted').checked = config.SyncCompleted;
                document.querySelector('#SyncOnHold').checked = config.SyncOnHold;
                document.querySelector('#SyncDropped').checked = config.SyncDropped;
                Dashboard.hideLoadingMsg();
            });
        });

        document.querySelector('#AniBridgeConfigForm').addEventListener('submit', function (e) {
            e.preventDefault();
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(AniBridgeConfig.pluginId).then(function (config) {
                config.ShindenEnabled = document.querySelector('#ShindenEnabled').checked;
                config.ShindenUsername = document.querySelector('#ShindenUsername').value;
                config.ShindenPassword = document.querySelector('#ShindenPassword').value;
                config.ShindenUserId = document.querySelector('#ShindenUserId').value;
                config.SonarrEnabled = document.querySelector('#SonarrEnabled').checked;
                config.SonarrUrl = document.querySelector('#SonarrUrl').value;
                config.SonarrApiKey = document.querySelector('#SonarrApiKey').value;
                config.SonarrQualityProfileId = parseInt(document.querySelector('#SonarrQualityProfileId').value, 10) || 1;
                config.SonarrRootFolder = document.querySelector('#SonarrRootFolder').value;
                config.RadarrEnabled = document.querySelector('#RadarrEnabled').checked;
                config.RadarrUrl = document.querySelector('#RadarrUrl').value;
                config.RadarrApiKey = document.querySelector('#RadarrApiKey').value;
                config.RadarrQualityProfileId = parseInt(document.querySelector('#RadarrQualityProfileId').value, 10) || 1;
                config.RadarrRootFolder = document.querySelector('#RadarrRootFolder').value;
                config.SyncWatching = document.querySelector('#SyncWatching').checked;
                config.SyncPlanned = document.querySelector('#SyncPlanned').checked;
                config.SyncCompleted = document.querySelector('#SyncCompleted').checked;
                config.SyncOnHold = document.querySelector('#SyncOnHold').checked;
                config.SyncDropped = document.querySelector('#SyncDropped').checked;
                ApiClient.updatePluginConfiguration(AniBridgeConfig.pluginId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                });
            });
            return false;
        });

        document.querySelector('#AniBridgeSyncNow').addEventListener('click', function () {
            aniBridgeSetStatus('Looking for the sync task…');
            ApiClient.getScheduledTasks().then(function (tasks) {
                var task = tasks.find(function (t) { return t.Key === AniBridgeConfig.taskKey; });
                if (!task) {
                    aniBridgeSetStatus('AniBridgeDailySync task not found. Restart the server.');
                    return;
                }
                aniBridgeSetStatus('Starting sync… follow progress in Dashboard → Scheduled Tasks.');
                ApiClient.startScheduledTask(task.Id).then(function () {
                    aniBridgeSetStatus('Sync started. See Dashboard → Scheduled Tasks for results.');
                }, function () {
                    aniBridgeSetStatus('Failed to start sync.');
                });
            }, function () {
                aniBridgeSetStatus('Failed to load scheduled tasks.');
            });
        });
    </script>
</div>
