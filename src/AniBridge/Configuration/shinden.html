<div id="AniBridgeShindenPage" data-role="page" class="page type-interior pluginConfigurationPage"
    data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <div id="AniBridgeShindenChips" style="margin-bottom:0.8em;"></div>
            <form id="AniBridgeShindenForm">
                <h3 class="sectionTitle">Shinden.pl</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="ShindenEnabled" />
                        <span>Enable Shinden sync</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ShindenUsername">Login or email</label>
                    <input id="ShindenUsername" type="text" is="emby-input" />
                    <div class="fieldDescription" id="ShindenUsernameError" style="color:#e74c3c;"></div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ShindenPassword">Password</label>
                    <div style="display:flex;gap:0.4em;align-items:center;">
                        <input id="ShindenPassword" type="password" is="emby-input" autocomplete="off" style="flex:1;min-width:0;" />
                        <button id="ShindenShowPass" type="button" is="emby-button" class="raised emby-button" style="flex:none;">
                            <span>Show</span>
                        </button>
                    </div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ShindenUserId">List ID (e.g. 420984-opzo)</label>
                    <input id="ShindenUserId" type="text" is="emby-input" placeholder="420984-opzo" />
                    <div class="fieldDescription">Public list: https://shinden.pl/animelist/YOUR-ID (a pasted full URL works too)</div>
                    <div class="fieldDescription" id="ShindenUserIdError" style="color:#e74c3c;"></div>
                </div>
                <div>
                    <button id="AniBridgeTestShinden" is="emby-button" type="button" class="raised block emby-button">
                        <span>Test login &amp; list</span>
                    </button>
                </div>
                <div class="fieldDescription" id="AniBridgeTestResult"></div>

                <h3 class="sectionTitle">Synced statuses</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncWatching" />
                        <span>Watching</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncPlanned" />
                        <span>Planned</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncCompleted" />
                        <span>Completed</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncOnHold" />
                        <span>On hold</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SyncDropped" />
                        <span>Dropped</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="DryRun" />
                        <span>Dry run — log what would be added without adding anything</span>
                    </label>
                    <div class="fieldDescription">Recommended for the first run. Turn off when the log looks right.</div>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>

                <h3 class="sectionTitle">Manual sync</h3>
                <div>
                    <button id="AniBridgeSyncNow" is="emby-button" type="button" class="raised block emby-button">
                        <span>Sync now</span>
                    </button>
                </div>
                <div class="fieldDescription" id="AniBridgeSyncStatus"></div>

                <h3 class="sectionTitle">Last sync</h3>
                <div style="display:flex;gap:0.5em;flex-wrap:wrap;align-items:center;margin-bottom:0.5em;">
                    <select is="emby-select" id="AniBridgeHistorySelect" class="emby-select" style="flex:1;min-width:12em;"></select>
                    <button id="AniBridgeRefreshReport" is="emby-button" type="button" class="raised emby-button">
                        <span>Refresh</span>
                    </button>
                </div>
                <div style="display:flex;gap:0.5em;flex-wrap:wrap;margin-bottom:0.5em;">
                    <input id="AniBridgeSearch" type="text" is="emby-input" placeholder="Search titles…" style="flex:2;min-width:10em;" />
                    <select is="emby-select" id="AniBridgeOutcomeFilter" class="emby-select" style="flex:1;min-width:8em;">
                        <option value="">All outcomes</option>
                        <option value="0">Added</option>
                        <option value="1">Already exists</option>
                        <option value="4">Would add</option>
                        <option value="2">Skipped</option>
                        <option value="3">Failed</option>
                        <option value="-1">Unknown</option>
                    </select>
                </div>
                <div class="fieldDescription" id="AniBridgeLastSyncMeta">No sync has run yet.</div>
                <div id="AniBridgeBadges" style="display:flex;gap:0.4em;flex-wrap:wrap;margin:0.5em 0;"></div>
                <div class="fieldDescription" id="AniBridgeFatalHint" style="color:#e67e22;"></div>
                <details open>
                    <summary><strong>Added / existing / would add</strong> <span id="AniBridgeGoodCount"></span></summary>
                    <ul id="AniBridgeAddedList"></ul>
                </details>
                <details open>
                    <summary><strong>Skipped / failed</strong> <span id="AniBridgeBadCount"></span></summary>
                    <ul id="AniBridgeSkippedList"></ul>
                </details>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var AniBridgeShinden = {
            pluginId: 'befab610-6eca-4d99-8e12-cdb4e26114aa',
            taskKey: 'AniBridgeDailySync',
            report: null,
            pollTimer: null
        };

        function aniBridgeNav(page) {
            if (window.Dashboard && Dashboard.navigate) {
                Dashboard.navigate('configurationpage?name=' + encodeURIComponent(page));
            }
        }

        // Server serializes PascalCase (Jellyfin default); accept both casings.
        function abPick(o, camel, pascal) {
            if (!o) { return undefined; }
            return o[camel] !== undefined ? o[camel] : o[pascal];
        }

        function abNormTarget(v, detail) {
            if (typeof v === 'string' && v) {
                var t = v.trim();
                if (/^sonarr$/i.test(t)) { return 'Sonarr'; }
                if (/^radarr$/i.test(t)) { return 'Radarr'; }
                return t;
            }
            // Backward compat: old reports have no Target, only Detail="Sonarr[/Radarr]...".
            if (typeof detail === 'string' && detail) {
                if (/^\s*sonarr\b/i.test(detail)) { return 'Sonarr'; }
                if (/^\s*radarr\b/i.test(detail)) { return 'Radarr'; }
            }
            return null;
        }

        function abNormItem(i) {
            var rawOutcome = abPick(i, 'outcome', 'Outcome');
            var rawStatus = abPick(i, 'status', 'Status');
            var detail = abPick(i, 'detail', 'Detail');
            return {
                title: abPick(i, 'title', 'Title') || '',
                outcome: abNormOutcome(rawOutcome),
                outcomeRaw: (typeof rawOutcome === 'string') ? rawOutcome : null,
                status: abNormStatusName(rawStatus),
                detail: detail,
                sourceUrl: abPick(i, 'sourceUrl', 'SourceUrl'),
                aniListUrl: abPick(i, 'aniListUrl', 'AniListUrl'),
                hint: abPick(i, 'hint', 'Hint'),
                target: abNormTarget(abPick(i, 'target', 'Target'), detail)
            };
        }

        // Server (Jellyfin JSON) sends enums as strings ("Skipped"); accept numbers too.
        var abOutcomeMap = { added: 0, alreadyexists: 1, skipped: 2, failed: 3, wouldadd: 4 };

        function abNormOutcome(v) {
            if (typeof v === 'number' && isFinite(v)) { return v; }
            if (typeof v === 'string') {
                var t = v.trim().toLowerCase();
                if (/^-?\d+$/.test(t)) { return parseInt(t, 10); }
                if (t in abOutcomeMap) { return abOutcomeMap[t]; }
            }
            return -1;
        }

        var abStatusNames = ['Planned', 'Watching', 'Completed', 'Dropped', 'On hold'];

        function abNormStatusName(v) {
            if (typeof v === 'string' && v) { return v; }
            if (typeof v === 'number' && abStatusNames[v] !== undefined) { return abStatusNames[v]; }
            return null;
        }

        function abNormReport(r) {
            if (!r) { return null; }
            var res = abPick(r, 'result', 'Result') || {};
            var items = (abPick(res, 'items', 'Items') || []).map(abNormItem);
            function n(o) { return items.filter(function (i) { return i.outcome === o; }).length; }
            return {
                finishedAt: abPick(r, 'finishedAt', 'FinishedAt'),
                dryRun: !!abPick(r, 'dryRun', 'DryRun'),
                error: abPick(r, 'error', 'Error'),
                inProgress: !!abPick(r, 'inProgress', 'InProgress'),
                scope: abPick(r, 'scope', 'Scope'),
                result: {
                    scanned: items.length,
                    added: n(0), alreadyExists: n(1), skipped: n(2), failed: n(3), wouldAdd: n(4),
                    unknown: n(-1),
                    items: items
                }
            };
        }

        function abNormStatus(s) {
            s = s || {};
            return {
                shindenOk: !!abPick(s, 'shindenOk', 'ShindenOk'),
                sonarrOk: !!abPick(s, 'sonarrOk', 'SonarrOk'),
                radarrOk: !!abPick(s, 'radarrOk', 'RadarrOk'),
                dryRun: !!abPick(s, 'dryRun', 'DryRun'),
                hint: abPick(s, 'hint', 'Hint')
            };
        }

        function abNormTest(t) {
            t = t || {};
            return {
                ok: !!abPick(t, 'ok', 'Ok'),
                message: abPick(t, 'message', 'Message') || 'No response from server.',
                entries: abPick(t, 'entries', 'Entries')
            };
        }

        function aniBridgeTimeAgo(iso) {
            if (!iso) { return 'unknown time'; }
            var diff = Date.now() - new Date(iso).getTime();
            if (diff < 60000) { return 'just now'; }
            if (diff < 3600000) { return Math.floor(diff / 60000) + ' min ago'; }
            if (diff < 86400000) { return Math.floor(diff / 3600000) + ' h ago'; }
            return new Date(iso).toLocaleString();
        }

        function abBuildTabs(box, current, s) {
            box.innerHTML = '';
            var bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:0.4em;flex-wrap:wrap;align-items:center;';
            var pages = [
                ['Overview', 'AniBridge', null],
                ['Shinden', 'AniBridge Shinden', s.shindenOk],
                ['Sonarr', 'AniBridge Sonarr', s.sonarrOk],
                ['Radarr', 'AniBridge Radarr', s.radarrOk]
            ];
            pages.forEach(function (p) {
                var b = document.createElement('button');
                b.type = 'button';
                var active = p[1] === current;
                b.style.cssText = 'border:none;border-radius:0.4em;padding:0.4em 0.9em;' +
                    'cursor:' + (active ? 'default' : 'pointer') + ';' +
                    'font-weight:' + (active ? 'bold' : 'normal') + ';' +
                    'background:' + (active ? '#00a4dc' : 'rgba(127,140,141,0.25)') + ';color:#fff;';
                b.textContent = p[0] + (p[2] === null ? '' : (p[2] ? ' ✓' : ' ✗'));
                if (!active) {
                    (function (page) {
                        b.addEventListener('click', function () { aniBridgeNav(page); });
                    })(p[1]);
                }
                bar.appendChild(b);
            });
            var mode = document.createElement('span');
            mode.style.cssText = 'font-size:0.8em;font-weight:bold;color:' +
                (s.dryRun ? '#f39c12' : '#27ae60') + ';';
            mode.textContent = s.dryRun ? 'DRY RUN' : 'LIVE';
            bar.appendChild(mode);
            box.appendChild(bar);
            return bar;
        }

        function aniBridgeLoadStatus() {
            ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/status'), dataType: 'json' })
                .then(function (s) {
                    s = abNormStatus(s);
                    var box = document.querySelector('#AniBridgeShindenChips');
                    abBuildTabs(box, 'AniBridge Shinden', s);
                    if (s.hint) {
                        var hint = document.createElement('div');
                        hint.className = 'fieldDescription';
                        hint.textContent = s.hint;
                        box.appendChild(hint);
                    }
                }, function () {
                    document.querySelector('#AniBridgeShindenChips').textContent = 'Could not load status.';
                });
        }

        function aniBridgeOutcomeName(item) {
            var names = { 0: 'Added', 1: 'Already exists', 2: 'Skipped', 3: 'Failed', 4: 'Would add' };
            if (names[item.outcome] !== undefined) { return names[item.outcome]; }
            return item.outcomeRaw || ('#' + item.outcome);
        }

        function aniBridgeFilterActive() {
            var q = (document.querySelector('#AniBridgeSearch').value || '').trim();
            var f = document.querySelector('#AniBridgeOutcomeFilter').value;
            return q !== '' || f !== '';
        }

        function aniBridgePassesFilter(item) {
            var q = (document.querySelector('#AniBridgeSearch').value || '').toLowerCase();
            var f = document.querySelector('#AniBridgeOutcomeFilter').value;
            if (f !== '' && String(item.outcome) !== f) { return false; }
            if (q && (item.title || '').toLowerCase().indexOf(q) < 0) { return false; }
            return true;
        }

        function aniBridgeOutcomeColor(o) {
            return { 0: '#27ae60', 1: '#2980b9', 4: '#16a085', 2: '#f39c12', 3: '#e74c3c', '-1': '#95a5a6' }[o] || '#7f8c8d';
        }

        function aniBridgeChip(text, bg) {
            var s = document.createElement('span');
            s.textContent = text;
            s.style.cssText = 'background:' + bg + ';color:#fff;border-radius:0.8em;' +
                'padding:0.05em 0.55em;font-size:0.8em;white-space:nowrap;';
            return s;
        }

        function aniBridgeGroupByReason(items) {
            var groups = [];
            var map = {};
            items.forEach(function (item) {
                var key = (item.detail || '') + '\n' + (item.hint || '');
                if (!map[key]) {
                    map[key] = { detail: item.detail, hint: item.hint, items: [] };
                    groups.push(map[key]);
                }
                map[key].items.push(item);
            });
            return groups;
        }

        function aniBridgeTargetColor(t) {
            if (/^sonarr$/i.test(t || '')) { return '#8e44ad'; }
            if (/^radarr$/i.test(t || '')) { return '#d35400'; }
            return '#7f8c8d';
        }

        function aniBridgeActionLink(parent, text, href, onClick) {
            var a = document.createElement('a');
            a.href = href || '#';
            a.textContent = text;
            a.style.cssText = 'color:#00a4dc;text-decoration:underline;font-size:1em;' +
                'font-weight:500;padding:0.25em 0.15em;';
            if (href) { a.target = '_blank'; a.rel = 'noopener'; }
            if (onClick) {
                a.addEventListener('click', onClick);
            }
            parent.appendChild(a);
            return a;
        }

        function aniBridgeRow(item) {
            var li = document.createElement('li');
            li.style.cssText = 'list-style:none;margin:0 0 0.7em;padding:0;';
            var det = document.createElement('details');
            var sum = document.createElement('summary');
            sum.style.cssText = 'cursor:pointer;font-size:1.05em;';
            sum.appendChild(aniBridgeChip(aniBridgeOutcomeName(item), aniBridgeOutcomeColor(item.outcome)));
            sum.appendChild(document.createTextNode(' '));
            if (item.status) {
                sum.appendChild(aniBridgeChip(item.status, '#555'));
                sum.appendChild(document.createTextNode(' '));
            }
            if (item.target) {
                sum.appendChild(aniBridgeChip(item.target, aniBridgeTargetColor(item.target)));
                sum.appendChild(document.createTextNode(' '));
            }
            var title = document.createElement('strong');
            title.textContent = item.title;
            sum.appendChild(title);
            det.appendChild(sum);
            var links = document.createElement('div');
            links.style.cssText = 'padding:0.3em 0 0.3em 1.4em;display:flex;flex-wrap:wrap;' +
                'align-items:center;gap:0.15em;';
            var needSep = false;
            function sep() {
                if (needSep) {
                    var s = document.createElement('span');
                    s.textContent = '·';
                    s.style.cssText = 'color:#aaa;margin:0 0.35em;';
                    links.appendChild(s);
                }
                needSep = true;
            }
            if (item.sourceUrl) {
                sep();
                aniBridgeActionLink(links, 'Shinden', item.sourceUrl);
            }
            if (item.aniListUrl) {
                sep();
                aniBridgeActionLink(links, 'AniList', item.aniListUrl);
            }
            sep();
            aniBridgeActionLink(links, 'Copy title', null, function (e) {
                e.preventDefault();
                if (navigator.clipboard) { navigator.clipboard.writeText(item.title); }
            });
            det.appendChild(links);
            li.appendChild(det);
            return li;
        }

        function aniBridgeReasonBanner(ul, detail, hint, count, showCount) {
            var li = document.createElement('li');
            li.style.cssText = 'list-style:none;margin:0.4em 0 0.3em;padding:0.35em 0.6em;' +
                'background:rgba(127,140,141,0.15);border-radius:0.4em;';
            var head = document.createElement('div');
            head.style.fontWeight = 'bold';
            head.textContent = (detail || 'No details') + (showCount ? ' (' + count + ')' : '');
            li.appendChild(head);
            if (hint) {
                var h = document.createElement('div');
                h.style.opacity = '0.85';
                h.textContent = '💡 ' + hint;
                li.appendChild(h);
            }
            ul.appendChild(li);
        }

        function aniBridgeFillList(id, items, limit, emptyText) {
            var ul = document.querySelector('#' + id);
            ul.innerHTML = '';
            ul.style.listStyle = 'none';
            ul.style.paddingLeft = '0';
            if (items.length === 0) {
                var none = document.createElement('li');
                none.style.listStyle = 'none';
                none.textContent = emptyText || '—';
                ul.appendChild(none);
                return;
            }
            var groups = aniBridgeGroupByReason(items);
            var shown = 0;
            var done = false;
            groups.forEach(function (g) {
                if (done) { return; }
                if (groups.length > 1 || g.detail || g.hint) {
                    aniBridgeReasonBanner(ul, g.detail, g.hint, g.items.length, groups.length > 1);
                }
                g.items.forEach(function (item) {
                    if (shown >= limit) { done = true; return; }
                    shown++;
                    ul.appendChild(aniBridgeRow(item));
                });
            });
            if (items.length > shown) {
                var more = document.createElement('li');
                more.style.listStyle = 'none';
                more.textContent = '…and ' + (items.length - shown) + ' more (use search to narrow down)';
                ul.appendChild(more);
            }
        }

        function aniBridgeRenderReport(report) {
            AniBridgeShinden.report = report;
            var meta = document.querySelector('#AniBridgeLastSyncMeta');
            var badges = document.querySelector('#AniBridgeBadges');
            badges.innerHTML = '';
            if (!report || !report.finishedAt) {
                meta.textContent = 'No sync has run yet.';
                document.querySelector('#AniBridgeFatalHint').textContent = '';
                aniBridgeFillList('AniBridgeAddedList', [], 300);
                aniBridgeFillList('AniBridgeSkippedList', [], 300);
                return;
            }
            var r = report.result || {};
            var items = r.items || [];
            meta.textContent = (report.inProgress ? 'Running… updated ' : 'Finished ') +
                aniBridgeTimeAgo(report.finishedAt) +
                ' (' + new Date(report.finishedAt).toLocaleString() + ')' +
                (report.dryRun ? ' (dry run)' : ' (live)') +
                (report.scope ? ' — scope: ' + report.scope : '');
            if (report.error) {
                meta.textContent += ' — FAILED: ' + report.error;
                var hint = document.querySelector('#AniBridgeFatalHint');
                hint.textContent = 'Check Shinden login / list visibility, then run sync again. See logs for details.';
            } else {
                document.querySelector('#AniBridgeFatalHint').textContent = '';
            }
            var defs = [
                ['Scanned', r.scanned || 0, '#7f8c8d'],
                ['Added', r.added || 0, '#27ae60'],
                ['AlreadyExists', r.alreadyExists || 0, '#2980b9'],
                ['WouldAdd', r.wouldAdd || 0, '#16a085'],
                ['Skipped', r.skipped || 0, '#f39c12'],
                ['Failed', r.failed || 0, '#e74c3c']
            ];
            if (r.unknown) { defs.push(['Unknown', r.unknown, '#95a5a6']); }
            defs.forEach(function (d) {
                var s = document.createElement('span');
                s.textContent = d[0] + ': ' + d[1];
                s.style.cssText = 'background:' + d[2] + ';color:#fff;border-radius:1em;padding:0.15em 0.7em;font-size:0.9em;';
                badges.appendChild(s);
            });
            var goodAll = items.filter(function (i) { return i.outcome === 0 || i.outcome === 1 || i.outcome === 4; });
            var badAll = items.filter(function (i) { return i.outcome === 2 || i.outcome === 3 || i.outcome === -1; });
            var good = goodAll.filter(aniBridgePassesFilter);
            var bad = badAll.filter(aniBridgePassesFilter);
            document.querySelector('#AniBridgeGoodCount').textContent = '(' + good.length + ')';
            document.querySelector('#AniBridgeBadCount').textContent = '(' + bad.length + ')';
            var emptyFiltered = 'No matches — clear search or outcome filter.';
            var emptyNone = report.inProgress ? 'Nothing in this group yet — sync is still running…' : '—';
            aniBridgeFillList('AniBridgeAddedList', good, 300,
                goodAll.length ? emptyFiltered : emptyNone);
            aniBridgeFillList('AniBridgeSkippedList', bad, 300,
                badAll.length ? emptyFiltered : emptyNone);
        }

        function aniBridgeLoadReport() {
            var meta = document.querySelector('#AniBridgeLastSyncMeta');
            meta.textContent = 'Loading…';
            ApiClient.ajax({
                type: 'GET',
                url: ApiClient.getUrl('AniBridge/last-sync'),
                dataType: 'json'
            }).then(function (report) {
                aniBridgeRenderReport(abNormReport(report));
            }, function () {
                aniBridgeRenderReport(null);
            });
        }

        function aniBridgeLoadHistory(selected) {
            var sel = document.querySelector('#AniBridgeHistorySelect');
            ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/history'), dataType: 'json' })
                .then(function (history) {
                    sel.innerHTML = '';
                    history = (history || []).map(abNormReport).filter(function (h) { return h && h.finishedAt; });
                    history.forEach(function (h, idx) {
                        var o = document.createElement('option');
                        o.value = String(idx);
                        var when = new Date(h.finishedAt).toLocaleString();
                        o.textContent = (idx === 0 ? 'Latest — ' : '') + when + (h.dryRun ? ' (dry run)' : '') +
                            (h.error ? ' FAILED' : '') + (h.inProgress ? ' (running…)' : '');
                        sel.appendChild(o);
                    });
                    if (history.length === 0) {
                        var o = document.createElement('option');
                        o.textContent = 'No history yet';
                        sel.appendChild(o);
                        sel.disabled = true;
                        return;
                    }
                    sel.disabled = false;
                    sel._history = history;
                    if (selected !== undefined) { sel.value = String(selected); }
                }, function () { });
            sel.onchange = function () {
                var h = sel._history && sel._history[parseInt(sel.value, 10)];
                if (h) { aniBridgeRenderReport(h); }
            };
        }

        function aniBridgeStopPoll() {
            if (AniBridgeShinden.pollTimer) {
                clearInterval(AniBridgeShinden.pollTimer);
                AniBridgeShinden.pollTimer = null;
            }
        }

        document.querySelector('#AniBridgeShindenPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(AniBridgeShinden.pluginId).then(function (config) {
                document.querySelector('#ShindenEnabled').checked = config.ShindenEnabled;
                document.querySelector('#ShindenUsername').value = config.ShindenUsername || '';
                document.querySelector('#ShindenPassword').value = config.ShindenPassword || '';
                document.querySelector('#ShindenUserId').value = config.ShindenUserId || '';
                document.querySelector('#SyncWatching').checked = config.SyncWatching;
                document.querySelector('#SyncPlanned').checked = config.SyncPlanned;
                document.querySelector('#SyncCompleted').checked = config.SyncCompleted;
                document.querySelector('#SyncOnHold').checked = config.SyncOnHold;
                document.querySelector('#SyncDropped').checked = config.SyncDropped;
                document.querySelector('#DryRun').checked = config.DryRun;
                Dashboard.hideLoadingMsg();
            });
            aniBridgeLoadStatus();
            aniBridgeLoadReport();
            aniBridgeLoadHistory();
        });

        function aniBridgeValidListId(v) {
            var s = (v || '').trim();
            if (!s) { return false; }
            if (/animelist\//i.test(s)) { return true; }
            return /^\d+(-\S+)?$/.test(s);
        }

        document.querySelector('#AniBridgeShindenForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var userErr = document.querySelector('#ShindenUsernameError');
            var idErr = document.querySelector('#ShindenUserIdError');
            userErr.textContent = '';
            idErr.textContent = '';
            var username = document.querySelector('#ShindenUsername').value.trim();
            var userId = document.querySelector('#ShindenUserId').value.trim();
            var enabled = document.querySelector('#ShindenEnabled').checked;
            var bad = false;
            if (enabled && !username) { userErr.textContent = 'Login is required when sync is enabled.'; bad = true; }
            if (enabled && !aniBridgeValidListId(userId)) {
                idErr.textContent = 'Use e.g. 420984-opzo or a full shinden.pl URL.';
                bad = true;
            }
            if (bad) { return false; }
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(AniBridgeShinden.pluginId).then(function (config) {
                config.ShindenEnabled = enabled;
                config.ShindenUsername = document.querySelector('#ShindenUsername').value;
                config.ShindenPassword = document.querySelector('#ShindenPassword').value;
                config.ShindenUserId = document.querySelector('#ShindenUserId').value;
                config.SyncWatching = document.querySelector('#SyncWatching').checked;
                config.SyncPlanned = document.querySelector('#SyncPlanned').checked;
                config.SyncCompleted = document.querySelector('#SyncCompleted').checked;
                config.SyncOnHold = document.querySelector('#SyncOnHold').checked;
                config.SyncDropped = document.querySelector('#SyncDropped').checked;
                config.DryRun = document.querySelector('#DryRun').checked;
                ApiClient.updatePluginConfiguration(AniBridgeShinden.pluginId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    aniBridgeLoadStatus();
                });
            });
            return false;
        });

        document.querySelector('#ShindenShowPass').addEventListener('click', function () {
            var input = document.querySelector('#ShindenPassword');
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            this.textContent = show ? 'Hide' : 'Show';
        });

        document.querySelector('#AniBridgeTestShinden').addEventListener('click', function () {
            var out = document.querySelector('#AniBridgeTestResult');
            out.textContent = 'Testing…';
            ApiClient.ajax({
                type: 'POST',
                url: ApiClient.getUrl('AniBridge/shinden/test'),
                data: JSON.stringify({
                    username: document.querySelector('#ShindenUsername').value,
                    password: document.querySelector('#ShindenPassword').value,
                    userId: document.querySelector('#ShindenUserId').value
                }),
                contentType: 'application/json',
                dataType: 'json'
            }).then(function (r) {
                r = abNormTest(r);
                out.textContent = (r.ok ? '✓ ' : '✗ ') + r.message +
                    (r.entries !== null && r.entries !== undefined ? ' (' + r.entries + ' entries)' : '');
            }, function () {
                out.textContent = 'Test failed to run.';
            });
        });

        document.querySelector('#AniBridgeSyncNow').addEventListener('click', function () {
            var status = document.querySelector('#AniBridgeSyncStatus');
            status.textContent = 'Looking for the sync task…';
            ApiClient.getScheduledTasks().then(function (tasks) {
                var task = tasks.find(function (t) { return t.Key === AniBridgeShinden.taskKey; });
                if (!task) {
                    status.textContent = 'AniBridgeDailySync task not found. Restart the server.';
                    return;
                }
                var before = AniBridgeShinden.report && AniBridgeShinden.report.finishedAt;
                status.textContent = 'Starting sync… progress is also in Dashboard → Scheduled Tasks.';
                ApiClient.startScheduledTask(task.Id).then(function () {
                    status.textContent = 'Sync running… this page refreshes automatically when it finishes.';
                    aniBridgeStopPoll();
                    var tries = 0;
                    AniBridgeShinden.pollTimer = setInterval(function () {
                        tries++;
                        ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/last-sync'), dataType: 'json' })
                            .then(function (report) {
                                report = abNormReport(report);
                                if (report && report.inProgress) {
                                    aniBridgeRenderReport(report);
                                    status.textContent = 'Sync running… (' + report.result.scanned + ' scanned so far)';
                                } else if (report && report.finishedAt && report.finishedAt !== before) {
                                    aniBridgeStopPoll();
                                    status.textContent = 'Sync finished — report updated.';
                                    aniBridgeRenderReport(report);
                                    aniBridgeLoadHistory(0);
                                    aniBridgeLoadStatus();
                                } else if (tries > 200) {
                                    aniBridgeStopPoll();
                                    status.textContent = 'Still running — check Dashboard → Scheduled Tasks.';
                                } else {
                                    status.textContent = 'Sync running… (' + tries * 3 + 's)';
                                }
                            }, function () {
                                if (tries > 200) {
                                    aniBridgeStopPoll();
                                    status.textContent = 'Still running — check Dashboard → Scheduled Tasks.';
                                }
                            });
                    }, 3000);
                }, function () {
                    status.textContent = 'Failed to start sync.';
                });
            }, function () {
                status.textContent = 'Failed to load scheduled tasks.';
            });
        });

        document.querySelector('#AniBridgeRefreshReport').addEventListener('click', function () {
            aniBridgeLoadReport();
            aniBridgeLoadHistory();
        });
        document.querySelector('#AniBridgeSearch').addEventListener('input', function () {
            if (AniBridgeShinden.report) { aniBridgeRenderReport(AniBridgeShinden.report); }
        });
        document.querySelector('#AniBridgeOutcomeFilter').addEventListener('change', function () {
            if (AniBridgeShinden.report) { aniBridgeRenderReport(AniBridgeShinden.report); }
        });
    </script>
</div>
