<div id="AniBridgeOverviewPage" data-role="page" class="page type-interior pluginConfigurationPage"
    data-require="emby-button">
    <div data-role="content">
        <div class="content-primary">
            <div class="fieldDescription">AniBridge:
                <a href="#" onclick="aniBridgeNav('AniBridge');return false;">Overview</a> &#183;
                <a href="#" onclick="aniBridgeNav('AniBridge Shinden');return false;">Shinden</a> &#183;
                <a href="#" onclick="aniBridgeNav('AniBridge Sonarr');return false;">Sonarr</a> &#183;
                <a href="#" onclick="aniBridgeNav('AniBridge Radarr');return false;">Radarr</a>
            </div>
            <h3 class="sectionTitle">AniBridge setup</h3>
            <div class="fieldDescription">Flow: Shinden → AniBridge → AniList → Sonarr/Radarr → Jellyfin. Nothing is ever deleted.</div>
            <div id="AniBridgeOvBanner" class="fieldDescription" style="font-weight:bold;"></div>
            <div id="AniBridgeOvChecklist" class="fieldDescription">Loading…</div>
            <div id="AniBridgeOvHint" class="fieldDescription"></div>
            <div style="display:flex;gap:0.5em;flex-wrap:wrap;margin:1em 0;">
                <button is="emby-button" type="button" class="raised emby-button" onclick="aniBridgeNav('AniBridge Shinden');return false;"><span>1 · Shinden</span></button>
                <button is="emby-button" type="button" class="raised emby-button" onclick="aniBridgeNav('AniBridge Sonarr');return false;"><span>2 · Sonarr</span></button>
                <button is="emby-button" type="button" class="raised emby-button" onclick="aniBridgeNav('AniBridge Radarr');return false;"><span>3 · Radarr</span></button>
            </div>
            <h3 class="sectionTitle">Last sync</h3>
            <div class="fieldDescription" id="AniBridgeOvLastSync">Loading…</div>
            <div class="fieldDescription">Details live on the Shinden page (search, filters, per-title hints).</div>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            function nav(page) {
                if (window.Dashboard && Dashboard.navigate) {
                    Dashboard.navigate('configurationpage?name=' + encodeURIComponent(page));
                }
            }
            window.aniBridgeNav = nav;

            function tick(ok) { return ok ? '✓' : '✗'; }

            // Server serializes PascalCase (Jellyfin default); accept both casings.
            function abPick(o, camel, pascal) {
                if (!o) { return undefined; }
                return o[camel] !== undefined ? o[camel] : o[pascal];
            }

            document.querySelector('#AniBridgeOverviewPage').addEventListener('pageshow', function () {
                var list = document.querySelector('#AniBridgeOvChecklist');
                var hint = document.querySelector('#AniBridgeOvHint');
                var banner = document.querySelector('#AniBridgeOvBanner');
                var last = document.querySelector('#AniBridgeOvLastSync');
                list.textContent = 'Loading…';
                ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/status'), dataType: 'json' })
                    .then(function (s) {
                        s = s || {};
                        var shindenOk = !!abPick(s, 'shindenOk', 'ShindenOk');
                        var sonarrOk = !!abPick(s, 'sonarrOk', 'SonarrOk');
                        var radarrOk = !!abPick(s, 'radarrOk', 'RadarrOk');
                        var dryRun = !!abPick(s, 'dryRun', 'DryRun');
                        var hint = abPick(s, 'hint', 'Hint');
                        list.textContent = 'Shinden ' + tick(shindenOk) + '  ·  Sonarr ' + tick(sonarrOk) +
                            '  ·  Radarr ' + tick(radarrOk);
                        hint.textContent = hint || '';
                        banner.textContent = dryRun
                            ? 'DRY RUN is ON — nothing is added to Sonarr/Radarr yet.'
                            : 'LIVE mode — sync adds to Sonarr/Radarr.';
                    }, function () {
                        list.textContent = 'Could not load status.';
                    });
                last.textContent = 'Loading…';
                ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/last-sync'), dataType: 'json' })
                    .then(function (report) {
                        report = report || {};
                        var r = abPick(report, 'result', 'Result') || {};
                        function c(camel, pascal) {
                            var v = abPick(r, camel, pascal);
                            return v === undefined || v === null ? 0 : v;
                        }
                        var when = abPick(report, 'finishedAt', 'FinishedAt');
                        when = when ? new Date(when).toLocaleString() : 'no sync yet';
                        var dryRun = !!abPick(report, 'dryRun', 'DryRun');
                        var error = abPick(report, 'error', 'Error');
                        var inProgress = !!abPick(report, 'inProgress', 'InProgress');
                        var parts = ['Scanned', 'Added', 'AlreadyExists', 'Skipped', 'Failed', 'WouldAdd']
                            .map(function (k) { return k + ': ' + c(k.charAt(0).toLowerCase() + k.slice(1), k); });
                        last.textContent = (dryRun ? '(dry run) ' : '') + (inProgress ? 'Running… ' : 'Finished ') + when + ' — ' + parts.join(' · ') +
                            (error ? ' — FAILED: ' + error : '');
                    }, function () {
                        last.textContent = 'No sync has run yet.';
                    });
            });
        })();
    </script>
</div>
