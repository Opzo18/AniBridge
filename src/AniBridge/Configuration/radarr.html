<div id="AniBridgeRadarrPage" data-role="page" class="page type-interior pluginConfigurationPage"
    data-require="emby-input,emby-button,emby-checkbox,emby-select">
    <div data-role="content">
        <div class="content-primary">
            <div id="AniBridgeRadarrChips" style="margin-bottom:0.8em;"></div>
            <form id="AniBridgeRadarrForm">
                <h3 class="sectionTitle">Radarr (movies)</h3>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="RadarrEnabled" />
                        <span>Enable Radarr</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrUrl">URL (e.g. http://192.168.33.20:7878)</label>
                    <input id="RadarrUrl" type="text" is="emby-input" placeholder="http://192.168.33.20:7878" />
                    <div class="fieldDescription" id="RadarrUrlError" style="color:#e74c3c;"></div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrApiKey">API key</label>
                    <div style="display:flex;gap:0.4em;align-items:center;">
                        <input id="RadarrApiKey" type="password" is="emby-input" autocomplete="off" style="flex:1;min-width:0;" />
                        <button id="RadarrShowKey" type="button" is="emby-button" class="raised emby-button" style="flex:none;">
                            <span>Show</span>
                        </button>
                    </div>
                    <div class="fieldDescription">Settings → General → Security in Radarr.</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrQualityProfileId">Quality profile</label>
                    <select is="emby-select" id="RadarrQualityProfileId" class="emby-select"></select>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrRootFolder">Root folder</label>
                    <select is="emby-select" id="RadarrRootFolder" class="emby-select"></select>
                    <div class="fieldDescription">Radarr requires a root folder for every added movie — pick where anime lands. With a single folder, Test selects it automatically.</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrMonitor">Monitor (new movies)</label>
                    <select is="emby-select" id="RadarrMonitor" class="emby-select">
                        <option value="movieOnly">Movie only</option>
                        <option value="movieAndCollection">Movie and collection</option>
                        <option value="none">None</option>
                    </select>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="RadarrAvailability">Minimum availability</label>
                    <select is="emby-select" id="RadarrAvailability" class="emby-select">
                        <option value="announced">Announced</option>
                        <option value="inCinemas">In cinemas</option>
                        <option value="released">Released</option>
                    </select>
                </div>
                <div class="fieldDescription" id="AniBridgeRadarrWarn"></div>
                <div class="fieldDescription" id="AniBridgeRadarrTest"></div>

                <div style="display:flex;gap:0.5em;flex-wrap:wrap;">
                    <button id="RadarrTestBtn" is="emby-button" type="button" class="raised emby-button" style="flex:1;min-width:10em;">
                        <span>Test &amp; reload lists</span>
                    </button>
                    <button is="emby-button" type="submit" class="raised button-submit emby-button" style="flex:1;min-width:10em;">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var AniBridgeRadarr = { pluginId: 'befab610-6eca-4d99-8e12-cdb4e26114aa' };

        function aniBridgeNav(page) {
            if (window.Dashboard && Dashboard.navigate) {
                Dashboard.navigate('configurationpage?name=' + encodeURIComponent(page));
            }
        }

        // Server serializes PascalCase (Jellyfin default); accept both casings.
        function abPick(o, camel, pascal) {
            if (!o) { return undefined; }
            return o[camel] !== undefined ? o[camel] : o[pascal];
        }

        function abNormArrRadarr(data) {
            data = data || {};
            return {
                qualityProfiles: abPick(data, 'qualityProfiles', 'QualityProfiles') || [],
                rootFolders: abPick(data, 'rootFolders', 'RootFolders') || [],
                error: abPick(data, 'error', 'Error')
            };
        }

        function renderRadarrChips(s) {
            s = s || {};
            var box = document.querySelector('#AniBridgeRadarrChips');
            box.innerHTML = '';
            var bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:0.4em;flex-wrap:wrap;align-items:center;';
            var pages = [
                ['Overview', 'AniBridge', null],
                ['Shinden', 'AniBridge Shinden', !!abPick(s, 'shindenOk', 'ShindenOk')],
                ['Sonarr', 'AniBridge Sonarr', !!abPick(s, 'sonarrOk', 'SonarrOk')],
                ['Radarr', 'AniBridge Radarr', !!abPick(s, 'radarrOk', 'RadarrOk')]
            ];
            pages.forEach(function (p) {
                var b = document.createElement('button');
                b.type = 'button';
                var active = p[1] === 'AniBridge Radarr';
                b.style.cssText = 'border:none;border-radius:0.4em;padding:0.4em 0.9em;' +
                    'cursor:' + (active ? 'default' : 'pointer') + ';' +
                    'font-weight:' + (active ? 'bold' : 'normal') + ';' +
                    'background:' + (active ? '#00a4dc' : 'rgba(127,140,141,0.25)') + ';color:#fff;';
                b.textContent = p[0] + (p[2] === null ? '' : (p[2] ? ' ✓' : ' ✗'));
                if (!active) {
                    (function (page) {
                        b.addEventListener('click', function () { aniBridgeNav(page); });
                    })(p[1]);
                }
                bar.appendChild(b);
            });
            var dryRun = !!abPick(s, 'dryRun', 'DryRun');
            var mode = document.createElement('span');
            mode.style.cssText = 'font-size:0.8em;font-weight:bold;color:' +
                (dryRun ? '#f39c12' : '#27ae60') + ';';
            mode.textContent = dryRun ? 'DRY RUN' : 'LIVE';
            bar.appendChild(mode);
            box.appendChild(bar);
        }

        function radarrFormState() {
            return {
                enabled: document.querySelector('#RadarrEnabled').checked,
                url: document.querySelector('#RadarrUrl').value.trim(),
                key: document.querySelector('#RadarrApiKey').value.trim()
            };
        }

        function renderRadarrStatus() {
            var el = document.querySelector('#AniBridgeRadarrTest');
            if (AniBridgeRadarr.test) {
                el.style.color = AniBridgeRadarr.test.ok ? '#2ecc71' : '#e74c3c';
                el.textContent = AniBridgeRadarr.test.msg;
                return;
            }
            var snap = AniBridgeRadarr.snapshot;
            var cur = radarrFormState();
            el.style.color = '';
            if (snap && (cur.enabled !== snap.enabled || cur.url !== snap.url || cur.key !== snap.key)) {
                el.textContent = 'Unsaved changes — Test or Save.';
            } else {
                el.textContent = '';
            }
        }

        function aniBridgeFillSelectRadarr(id, items, current, loaded) {
            var sel = document.querySelector('#' + id);
            sel.innerHTML = '';
            var values;
            if (!loaded) {
                values = [{ value: current || '', text: '— Test the connection first —' }];
            } else {
                values = items.slice();
                if (current && !values.some(function (v) { return v.value === current; })) {
                    values.unshift({ value: current, text: current + ' (saved)' });
                }
                if (values.length === 0) {
                    values.unshift({ value: '', text: '— No entries found —' });
                }
            }
            values.forEach(function (v) {
                var o = document.createElement('option');
                o.value = v.value;
                o.textContent = v.text;
                sel.appendChild(o);
            });
            if (current) { sel.value = current; }
        }

        function radarrProfileOptions(data) {
            return (data.qualityProfiles || []).map(function (p) {
                return { value: String(abPick(p, 'id', 'Id')), text: abPick(p, 'name', 'Name') };
            });
        }

        function radarrFolderOptions(data) {
            return (data.rootFolders || []).map(function (f) { return { value: f, text: f }; });
        }

        function radarrAutoSingle(id, options) {
            // One option means no real choice — select it so Save just works.
            if (options.length === 1) {
                document.querySelector('#' + id).value = options[0].value;
            }
        }

        function aniBridgeIsHttpUrlRadarr(s) {
            return /^https?:\/\/.+/.test((s || '').trim());
        }

        document.querySelector('#AniBridgeRadarrPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            AniBridgeRadarr.test = null;
            ApiClient.getPluginConfiguration(AniBridgeRadarr.pluginId).then(function (config) {
                document.querySelector('#RadarrEnabled').checked = config.RadarrEnabled;
                document.querySelector('#RadarrUrl').value = config.RadarrUrl || '';
                document.querySelector('#RadarrApiKey').value = config.RadarrApiKey || '';
                document.querySelector('#RadarrMonitor').value = config.RadarrMonitor || 'movieOnly';
                document.querySelector('#RadarrAvailability').value = config.RadarrAvailability || 'released';
                var savedProfile = String(config.RadarrQualityProfileId || 1);
                var savedFolder = config.RadarrRootFolder || '';
                AniBridgeRadarr.snapshot = radarrFormState();
                aniBridgeFillSelectRadarr('RadarrQualityProfileId', [], savedProfile, false);
                aniBridgeFillSelectRadarr('RadarrRootFolder', [], savedFolder, false);
                renderRadarrStatus();
                ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/status'), dataType: 'json' })
                    .then(function (s) {
                        renderRadarrChips(s);
                    }, function () { });
                ApiClient.ajax({
                    type: 'GET',
                    url: ApiClient.getUrl('AniBridge/radarr/options'),
                    dataType: 'json'
                }).then(function (data) {
                    data = abNormArrRadarr(data);
                    var profiles = radarrProfileOptions(data);
                    var folders = radarrFolderOptions(data);
                    aniBridgeFillSelectRadarr('RadarrQualityProfileId',
                        profiles, savedProfile, !data.error);
                    aniBridgeFillSelectRadarr('RadarrRootFolder',
                        folders, savedFolder, !data.error);
                    if (!data.error) {
                        radarrAutoSingle('RadarrQualityProfileId', profiles);
                        radarrAutoSingle('RadarrRootFolder', folders);
                    }
                    document.querySelector('#AniBridgeRadarrWarn').textContent = data.error || '';
                    Dashboard.hideLoadingMsg();
                }, function () {
                    document.querySelector('#AniBridgeRadarrWarn').textContent =
                        'Could not load lists from Radarr. Check URL/key, saved values kept.';
                    Dashboard.hideLoadingMsg();
                });
            });
        });

        ['RadarrEnabled', 'RadarrUrl', 'RadarrApiKey'].forEach(function (id) {
            document.querySelector('#' + id).addEventListener('input', function () {
                AniBridgeRadarr.test = null;
                renderRadarrStatus();
            });
            document.querySelector('#' + id).addEventListener('change', function () {
                AniBridgeRadarr.test = null;
                renderRadarrStatus();
            });
        });

        document.querySelector('#RadarrTestBtn').addEventListener('click', function () {
            var url = document.querySelector('#RadarrUrl').value;
            var key = document.querySelector('#RadarrApiKey').value;
            document.querySelector('#RadarrUrlError').textContent =
                aniBridgeIsHttpUrlRadarr(url) ? '' : 'URL should look like http://192.168.33.20:7878';
            if (!aniBridgeIsHttpUrlRadarr(url) || !key.trim()) {
                AniBridgeRadarr.test = { ok: false, msg: 'Enter URL and API key first, then Test.' };
                renderRadarrStatus();
                return;
            }
            AniBridgeRadarr.test = null;
            var msg = document.querySelector('#AniBridgeRadarrTest');
            msg.style.color = '';
            msg.textContent = 'Testing…';
            ApiClient.ajax({
                type: 'POST',
                url: ApiClient.getUrl('AniBridge/radarr/test'),
                data: JSON.stringify({ url: url.trim(), apiKey: key.trim() }),
                contentType: 'application/json',
                dataType: 'json'
            }).then(function (data) {
                data = abNormArrRadarr(data);
                var profiles = radarrProfileOptions(data);
                var folders = radarrFolderOptions(data);
                aniBridgeFillSelectRadarr('RadarrQualityProfileId',
                    profiles,
                    document.querySelector('#RadarrQualityProfileId').value, !data.error);
                aniBridgeFillSelectRadarr('RadarrRootFolder',
                    folders,
                    document.querySelector('#RadarrRootFolder').value, !data.error);
                if (!data.error) {
                    radarrAutoSingle('RadarrQualityProfileId', profiles);
                    radarrAutoSingle('RadarrRootFolder', folders);
                }
                document.querySelector('#AniBridgeRadarrWarn').textContent = data.error || '';
                AniBridgeRadarr.test = data.error
                    ? { ok: false, msg: 'Test: ' + data.error }
                    : { ok: true, msg: '✓ Connected — ' + data.qualityProfiles.length +
                        ' profiles, ' + data.rootFolders.length + ' folders.' };
                renderRadarrStatus();
            }, function () {
                AniBridgeRadarr.test = { ok: false, msg: 'Test failed to run.' };
                renderRadarrStatus();
            });
        });

        document.querySelector('#RadarrShowKey').addEventListener('click', function () {
            var input = document.querySelector('#RadarrApiKey');
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            this.textContent = show ? 'Hide' : 'Show';
        });

        document.querySelector('#AniBridgeRadarrForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var url = document.querySelector('#RadarrUrl').value;
            if (document.querySelector('#RadarrEnabled').checked && !aniBridgeIsHttpUrlRadarr(url)) {
                document.querySelector('#RadarrUrlError').textContent =
                    'URL should look like http://192.168.33.20:7878';
                return false;
            }
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(AniBridgeRadarr.pluginId).then(function (config) {
                config.RadarrEnabled = document.querySelector('#RadarrEnabled').checked;
                config.RadarrUrl = document.querySelector('#RadarrUrl').value.trim();
                config.RadarrApiKey = document.querySelector('#RadarrApiKey').value.trim();
                config.RadarrQualityProfileId = parseInt(document.querySelector('#RadarrQualityProfileId').value, 10) || 1;
                config.RadarrRootFolder = document.querySelector('#RadarrRootFolder').value;
                config.RadarrMonitor = document.querySelector('#RadarrMonitor').value || 'movieOnly';
                config.RadarrAvailability = document.querySelector('#RadarrAvailability').value || 'released';
                ApiClient.updatePluginConfiguration(AniBridgeRadarr.pluginId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    AniBridgeRadarr.snapshot = radarrFormState();
                    AniBridgeRadarr.test = null;
                    renderRadarrStatus();
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('AniBridge/status'), dataType: 'json' })
                        .then(function (s) {
                            renderRadarrChips(s);
                        }, function () { });
                });
            });
            return false;
        });
    </script>
</div>
